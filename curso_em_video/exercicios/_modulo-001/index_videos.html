<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este video está hospedado no meu próprio servidor</p>
    
    <video width="500" poster="imagens/limoes-capa.png" controls autoplay loop>
        <source src="imagens/videos/meu-video.mp4" type="video/mp4">
        <source src="imagens/videos/meu-video.webm" type="video/webm">
        <source src="imagens/videos/meu-video.ogv" type="video/ogg">
        <p>Seu computador não suporta videos!</p>
    </video>

    <h1>Inserindo videos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/LW0bhKitRBk?si=70mD-S12z3kn0MyR" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
