<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente  aumente e diminua o tamanho do seu navegador.</p>
    
    <picture>
        <source media="(max-width: 750px)"  srcset="imagens/img_dinamicas/fotop.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/img_dinamicas/fotom.png" type="image/png">
        <img src="imagens/img_dinamicas/fotog.png" alt="Imagem flexível">
    </picture>
    
    <h1>Reproduzindo áudios</h1>
    <p>Vamos aprender a reproduzir áudios no HTML5</p>
    <audio preload="metadata" controls loop>
        <source src="imagens/midia/happy-mistake.mp3" type="audio/mpeg">
        <source src="imagens/midia/happy-mistake.mp3" type="audio/ogg">
    </audio>
    
</body>
</html>
