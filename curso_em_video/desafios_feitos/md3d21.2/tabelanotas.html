<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 21</title>
    <style>
        body {

        table {

        }

            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {

            <tr>

                <td>6.5</td>    
            </tr>
            <tr>
                <td>Química</td>

            <tr>

            </tr>
        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
